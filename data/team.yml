members:
  - bio: Behaviour change specialist Anna has worked in sustainable transport since
      2008, at first focussing on bikes with Sustrans, and now on aviation with
      Flight Free UK. A lifelong environmentalist, she stopped flying more than
      15 years ago. A favourite flight-free trip was cycling the length of
      France to swim in the Mediterranean at Nice – returning by train rather
      than cycle home!
    name: Anna Hughes
    photo: /images/uploads/anna.jpeg
    role: Director
  - name: Aukse Budryte
    role: Social media intern
    bio: >-
      Dental nurse Aukse is based in Thurrock, Essex, and is passionate about
      conservation and ecology.

      She is particularly interested in how changes to our lifestyles, behaviours and everyday actions can make a meaningful difference in the long term. A dream flight-free trip would be to travel to as many countries as possible across Europe, exploring different places through a combination of rail journeys and buses either solo or with friends.
    photo: /images/uploads/aukse_budryte.jpg
  - name: Gully Bujak
    role: Communications Officer
    photo: /images/uploads/gully-bujak.jpg
    bio: Gully is a community organiser and freelance writer based in Hull. She is
      passionate about the power of words and storytelling to inspire us to
      imagine new ways of living together on this finite planet. Her dream
      flight free trip would be to the US, to visit the immense landscapes and
      learn from the community organising going there.
  - name: Jamie Street
    role: Social media intern
    bio: Leicester-based Jamie recently graduated from Brighton University with a BA
      (hons) in Film and Screen Studies. They are passionate about wildlife
      conservation and hope to one day have the opportunity to work with their
      favourite animal, sharks! A dream flight free trip would be to Norway by
      boat to see the marine life, especially orcas.
    photo: /images/uploads/jamie_street.jpg
  - name: Lucy Jarrett
    role: Social media intern
    bio: Living in Norwich and studying sustainable development at the University of
      East Anglia, Lucy also works as a bartender and plays lacrosse. Having
      spent many wonderful holidays in national parks she is passionate about
      conserving the environment. A dream would be to travel to Iceland via a
      ferry from Denmark to see its amazing scenery, including the waterfalls
      and geo-thermal hot springs.
    photo: /images/uploads/lucy_jarrett.jpg
  - name: Matilda Palmer
    role: Events Manager
    bio: Matilda lives in Hampshire and enjoys local conservation and litter picking
      in her spare time. She is passionate about travel infrastructure to give
      people more opportunities to travel greener. A dream flight-free trip
      would be to the north coast of Spain via ferry.
    photo: /images/uploads/matilda_palmer.jpeg
  - name: Sarah Hopewell
    role: Flight Free Schools administrator
    bio: With a background in health psychology and behaviour change, Sarah now
      works in the transport sector. She's a Green Party town and district
      councillor in Hertford and has enjoyed many flight-free trips including
      cycling holidays and trips to Europe.
    photo: /images/uploads/sarah-hopewell.jpeg
  - name: Simon Davison
    role: Events administrator intern
    bio: Based in Leeds, Simon works as a premium hospitality operator at a 4-star
      hotel. His BA (Hons) in Environmental Studies and Carbon Literacy
      certification has led him to volunteering with Flight Free UK in his spare
      time. A dream flight-free trip would be a scenic rail journey to Scotland
      to explore the rugged mountains, wild lochs, and remote national parks of
      the Highlands.
    photo: /images/uploads/simon_davison.jpg
  - name: Sophie Norstrom
    role: Communications intern
    bio: Philosophy graduate Sophie is passionate about understanding the social,
      political and economic inequalities of climate change. She is based in
      Edinburgh and enjoys exploring Scottish green spaces by finding new
      running routes. Her dream flight free trip would be to island-hop around
      the Stockholm Archipelago by ferry.
    photo: /images/uploads/sophie-norstrom.jpg
