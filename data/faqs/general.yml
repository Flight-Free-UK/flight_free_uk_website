faqs:
  - answer: >-
      Taking a flight is one of the most high-carbon activities we can do. Not
      everybody flies, but for those who do, flights will make up the most
      significant part of your carbon footprint. To put it in context, one
      return transatlantic flight generates more CO2 per passenger than [eating
      meat for a year, or driving for a
      year](https://flightfree.co.uk/post/what-has-aviation-got-to-do-with-climate-change/). 


      At at time where scientists tell us we must dramatically cut our carbon output, the aviation industry has plans to grow and expand. It is much easier to decarbonise other sectors such as heating and road transport than it will be to decarbonise aviation. Many flights are non-essential, so addressing how much we fly is a key part of facing the climate emergency.
    question: Why should we worry about flying?
  - answer: >-
      2﻿% is a low estimate and doesn't take into account the full warming
      impact of aviation, which includes radiative forcing (high-altitude
      emissions) and non-CO2 effects (e.g. water vapour contrails).


      A﻿ll told, aviation is responsible for about [4% of global climate change emissions](https://ourworldindata.org/co2-emissions-from-aviation). 


      But even 4% sounds low and insignificant. That’s not because emissions from aviation are low, it’s because, globally, very few people actually fly – only around [10 or 11% every year](https://partner.sciencenorway.no/climate-change-global-warming-transport/1-of-people-cause-half-of-global-aviation-emissions-most-people-in-fact-never-fly/1773607).


      Here in the UK, flights make up [8% of total emissions](https://commonslibrary.parliament.uk/research-briefings/cbp-8826/) (2019 figures), even though around half of Brits don't get on a plane in any given year.


      O﻿n an individual level, depending on how much people fly, flights could make up over half of one person's carbon output for the year.
    question: The aviation industry only contributes 2% of global emissions so it
      can’t be that bad, can it?
  - answer: >-
      I﻿t might be surprising to hear that business flights [only account for 9%
      of the flights we
      take](https://www.ons.gov.uk/peoplepopulationandcommunity/leisureandtourism/articles/traveltrends/2025),
      and this hasn’t changed much in the past few years. 


      The majority of flights (61%) are for holidays, with 28% being to visit family and friends.


      O﻿f course, we still need to work towards reducing business flights further, not least because flying business class is approximately three times more carbon-intensive than flying economy class owing to the extra space required.
    question: Isn’t it business flights that are responsible for most of the emissions?
  - answer: >-
      T﻿echnology will certainly play a role in decarbonising aviation, and
      there are some very impressive developments being made at the moment to
      explore carbon-neutral ways of flying.


      T﻿hese developments are still a long way off, though: it will probably be multiple decades before they make an impact on emissions. The first electric or hydrogen-powered flights won’t be commercially available until at least 2035, and will likely only be viable for short haul travel. 


      T﻿he electricity needed to power these planes will need to come from renewable sources in order to be truly carbon-neutral, and there are lots of other things competing for our renewable supplies at the moment, so aviation is probably not the priority.


      S﻿o while these development could help in the future, they will probably be small-scale (e.g. short flights between our island nations), and won't be able to replace aviation like-for-like as we know it today. 


      'G﻿reen' fuels are less promising, as not only are there questions about the sustainability of so-called 'sustainable' aviation fuel (SAF), the amount of SAF being produced and used is minuscule compared to the amount of jet fuel we burn.
    question: What about green fuel and electric flights?
  - answer: >-
      T﻿here's often confusion around this, because global emissions from animal
      agriculture are much higher than global emissions from aviation, so people
      assume that being vegan is better for the environment than stopping
      flying.


      T﻿he reason aviation emissions are lower in comparison is because globally, hardly anyone flies ([around 10%](https://partner.sciencenorway.no/climate-change-global-warming-transport/1-of-people-cause-half-of-global-aviation-emissions-most-people-in-fact-never-fly/1773607)), whereas a much higher proportion of people eat meat or animal products. On an individual level, the impact is a lot different: while being vegan can save around 1 tonne CO2 per year, you could [use that up in a single flight](https://flightfree.co.uk/post/is-it-better-to-be-vegan-or-give-up-flying/).
    question: Isn't being vegan more effective than stopping flying?
  - answer: >-
      T﻿here are lots of things that the government could do to make flight-free
      travel the easier choice, for example, making trains cheaper, and removing
      tax breaks for aviation. 


      W﻿e would love to see our politicians making the best choice for the climate, but that doesn't always happen. In the absence of proper climate action from our leaders, we can make those choices ourselves.


      Our individual actions can influence the system and encourage change from the top, especially if lots of us do it together. 


      Governments and industry respond to public opinion and consumer behaviour, so if we demonstrate with our actions that we don’t want to fly, we can influence policy. For example, as more people are choosing low-carbon travel, more ferry and rail routes are opening up across Europe, especially night trains.
    question: " Why do I have to change? Shouldn’t it be up to the government?"
  - answer: >-
      Not at all! Travel is still possible (and in many cases, far more
      enjoyable) without flying. 


      W﻿e have lots of ideas for places you can go on our [Destination Inspiration](/how_to/#destination-inspiration) page, and tips and info for flight-free travel on our [How to](/how_to/) page.


      S﻿ome places are harder than others, but it's possible to go anywhere in the world without flying, if you have the time!
    question: Does this mean I can't go on holiday?
  - question: I fly to escape the British weather. Can I still do that?
    answer: >-
      There are plenty of hot holiday destinations accessible without flying,
      for example
      [Spain](https://flightfree.co.uk/travel_articles/destination-spain/),
      [France](https://flightfree.co.uk/travel_articles/destination-south-of-france/),
      and Italy. 


      It is also possible to get to more exotic destinations such as [Morocco](https://flightfree.co.uk/travel_articles/winter-in-morocco/), [Sardinia](https://flightfree.co.uk/travel_articles/sardinia/) or [Greece](https://flightfree.co.uk/travel_articles/cardiff-to-crete/) by a combination of train and boat. Not flying doesn’t mean compromising on holiday destinations.


      H﻿aving said that, the UK weather isn’t always as bad as it seems, and [UK holidays](https://flightfree.co.uk/travel_articles/destination-uk/) can be just as enjoyable as holidays abroad.
  - question: Why should I stop flying when rich people fly around in private jets?
    answer: >-
      Private jets are extremely damaging to the climate, with up to [40x the
      emissions](https://avi-go.com/newsroom/articles/sustainable-aviation-environmental-impact-of-private-jets)
      (per passenger) of taking a commercial flight.


      W﻿e support a ban on private jets, and at the very least taxing private jet use at a much higher rate than regular aviation.


      H﻿owever, overall, private jets contribute a very small amount to aviation emissions. That doesn't mean we shouldn't worry about it or regulate the industry, but there would be a much bigger impact if overall levels of aviation came down, not just private jet use.
  - answer: >-
      It’s true that there are some eye-wateringly low prices out there. One of
      the reasons is that there’s [no tax on aviation
      fuel](https://researchbriefings.files.parliament.uk/documents/SN00523/SN00523.pdf),
      giving flights an unfair advantage over other forms of transport. 


      However, [it's not always cheaper to fly](https://www.theguardian.com/money/2019/aug/10/climate-crisis-holiday-no-fly-trains-ferries), especially once you factor in transfers and luggage allowance etc. in addition to your air fare. Book in advance or save with Interrail to get the best fares. Take a look at our budget tips [here](https://flightfree.co.uk/post/how-to-travel-on-a-budget/).
    question: But flying is so cheap!
  - answer: >-
      C﻿arbon offsetting is widely used by companies and airports that claim to
      be ‘carbon neutral’. Unfortunately this is a bit too good to be true. A
      2017 study showed that the majority of carbon offsetting schemes [didn’t
      absorb the necessary
      carbon](https://www.responsibletravel.com/copy/carbon-offsets), and while
      there are some gold-standard schemes out there, most of them rely on
      future carbon absorption (i.e. through planting trees), whereas flying
      emits carbon now.


      Carbon offset schemes often mean that people feel that they have dealt with the impact of their flight, so they continue to fly. The best way to offset carbon emissions is not to produce them in the first place.
    question: What about carbon offsetting?
  - answer: >-
      In the short term, your decision not to take a flight won't stop that
      particular plane from taking off, but in the longer term, lower demand
      leads to less supply. 


      A﻿irlines respond to customer demand, for example by putting extra flights on during sports tournaments. And if a particular route isn't profitable because people aren't taking it, the airline will withdraw it. 


      I﻿t's a difficult argument because your decision won't make an immediate difference, but it will contribute towards a shift away from taking flights that will ultimately lead to fewer flights taking off.
    question: The plane will take off anyway so there’s no point in me not flying
  - answer: >-
      T﻿here's not a straightforward answer to this, as it's inevitable that
      lower levels of flying would lead to fewer jobs in the aviation industry. 


      B﻿ut there are equivalent jobs in other industries that are transferable from aviation. In fact, a [2022 study](https://www.instagram.com/p/CaIAhMgo2Lq/) showed that moving to green transport would create more jobs than would be lost in the aviation sector.


      I﻿n terms of tourism, it's also a difficult question, because many places around the world rely on foreign visitors as a main source of income. But overtourism has become a problem in many places too, as a result of too many visitors putting pressure on local infrastructure, housing, water and natural sites. Machu Picchu is a prime example of this, as well as much closer destinations such as Barcelona and Mallorca, which have seen protests against tourism for many years.


      O﻿ne answer to this could be to avoid flying: we can still visit places that rely on tourist income, but because overland travel takes longer and tends to cost a bit more, it wouldn't be at a rate that causes problems for locals. 


      I﻿t's also worth supporting our own local tourism industry here in the UK.
    question: What about global tourism and the jobs involved with aviation?
