faqs:
  - answer: >-
      Taking a flight is one of the most high-carbon activities we can do. Not
      everybody flies, but for those who do, flights will make up the most
      significant part of your carbon footprint. To put it in context, one
      return transatlantic flight generates more CO2 per passenger than [eating
      meat for a year, or driving for a
      year](https://flightfree.co.uk/post/what-has-aviation-got-to-do-with-climate-change/). 


      At at time where scientists tell us we must dramatically cut our carbon output, the aviation industry has plans to grow and expand. It is much easier to decarbonise other sectors such as heating and road transport than it will be to decarbonise aviation. Many flights are non-essential, so addressing how much we fly is a key part of facing the climate emergency.
    question: Why should we worry about flying?
  - answer: >-
      2﻿% is a low estimate and doesn't take into account the full warming
      impact of aviation, which includes radiative forcing (high-altitude
      emissions) and non-CO2 effects (e.g. water vapour contrails).


      A﻿ll told, aviation is responsible for about [4% of global climate change emissions](https://ourworldindata.org/co2-emissions-from-aviation). 


      But even 4% sounds low and insignificant. That’s not because emissions from aviation are low, it’s because, globally, very few people actually fly – only around [10 or 11% every year](https://partner.sciencenorway.no/climate-change-global-warming-transport/1-of-people-cause-half-of-global-aviation-emissions-most-people-in-fact-never-fly/1773607).


      Here in the UK, flights make up [8% of total emissions](https://commonslibrary.parliament.uk/research-briefings/cbp-8826/) (2019 figures), even though around half of Brits don't get on a plane in any given year.


      O﻿n an individual level, depending on how much people fly, flights could make up over half of one person's carbon output for the year.
    question: The aviation industry only contributes 2% of global emissions so it
      can’t be that bad, can it?
  - answer: >-
      I﻿t might be surprising to hear that business flights [only account for 9%
      of the flights we
      take](https://www.ons.gov.uk/peoplepopulationandcommunity/leisureandtourism/articles/traveltrends/2025),
      and this hasn’t changed much in the past few years. 


      The majority of flights (61%) are for holidays, with 28% being to visit family and friends.


      O﻿f course, we still need to work towards reducing business flights further, not least because flying business class is approximately three times more carbon-intensive than flying economy class owing to the extra space required.
    question: Isn’t it business flights that are responsible for most of the emissions?
  - answer: >-
      T﻿echnology will certainly play a role in decarbonising aviation, and
      there are some very impressive developments being made at the moment to
      explore carbon-neutral ways of flying.


      T﻿hese developments are still a long way off, though: it will probably be multiple decades before they make an impact on emissions. The first electric or hydrogen-powered flights won’t be commercially available until at least 2035, and will likely only be viable for short haul travel. 


      T﻿he electricity needed to power these planes will need to come from renewable sources in order to be truly carbon-neutral, and there are lots of other things competing for our renewable supplies at the moment, so aviation is probably not the priority.


      S﻿o while these development could help in the future, they will probably be small-scale (e.g. short flights between our island nations), and won't be able to replace aviation like-for-like as we know it today. 


      'G﻿reen' fuels are less promising, as not only are there questions about the sustainability of so-called 'sustainable' aviation fuel (SAF), the amount of SAF being produced and used is minuscule compared to the amount of jet fuel we burn.
    question: What about green fuel and electric flights?
  - answer: >-
      Being vegan is an excellent way of reducing your environmental impact, as
      a plant-based diet uses a fraction of the resources in terms of land use
      and water than a meat-based diet. 


      In terms of carbon output, while being vegan can save around 1 tonne CO2 per year, you could [use that up in a single flight](https://flightfree.co.uk/post/is-it-better-to-be-vegan-or-give-up-flying/).
    question: Isn't being vegan more effective than stopping flying?
  - answer: >-
      System change is essential for making the large scale shifts that we
      desperately need to see. However, it’s never one or the other. Our
      individual actions can influence the system, especially if lots of us do
      it together. 


      Governments and industry respond to public opinion and consumer behaviour, so if we demonstrate with our actions that we don’t want to fly, we can influence policy. As more people are choosing low-carbon travel, more ferry and rail routes are opening up across Europe, especially night trains. This shows we are having an impact!
    question: " Why do I have to change? Shouldn’t it be up to the government?"
  - answer: Not at all! Travel is still possible (and in many cases, far more
      enjoyable) without flying. Our [How to](/how_to/#destination-inspiration)
      pages are packed full with inspiring stories of overland travel to
      destinations near and far.
    question: Does this mean I can't go on holiday?
  - question: I fly to escape the British weather. Can I still do that?
    answer: >-
      There are plenty of hot holiday destinations accessible without flying,
      for example Spain, France, and Italy. It is also possible to get to more
      exotic destinations such as
      [Morocco](https://flightfree.co.uk/travel_articles/winter-in-morocco/),
      [Sardinia](https://flightfree.co.uk/travel_articles/sardinia/) or Greece
      by a combination of train and boat. Not flying doesn’t mean compromising
      on holiday destinations.


      H﻿aving said that, the UK weather isn’t always as bad as it seems, and UK holidays can be just as enjoyable as holidays abroad. Also bear in mind that unpredictable weather is made worse by an excess of greenhouse gases, so it’s even more important to avoid flying to holiday destinations in order to preserve the weather for the generations to come.
  - question: Why should I stop flying when rich people fly around in private jets?
    answer: >-
      I﻿t's true that rich people fly in private jets, which are extremely
      damaging to the climate, with roughly 40x the emissions (per passenger) of
      taking a commercial flight.


      H﻿owever, overall, private jets contribute just 2% to aviation emissions – that doesn't mean we shouldn't worry about it, but we could have a much greater impact if lots of people choose not to fly on holiday. 


      P﻿ointing to private jet use can also be a distraction from people taking climate action. We all have a role to play in addressing the climate emergency, and we shouldn't feel that's not important because celebrities fly around in private jets.
  - answer: >-
      It’s true that there are some eye-wateringly low prices out there. One of
      the reasons is that there’s [no tax on aviation
      fuel](https://researchbriefings.files.parliament.uk/documents/SN00523/SN00523.pdf),
      giving flights an unfair advantage over other forms of transport. 


      However, [it's not always cheaper to fly](https://www.theguardian.com/money/2019/aug/10/climate-crisis-holiday-no-fly-trains-ferries), especially once you factor in transfers and luggage allowance etc. in addition to your air fare. Book in advance or save with Interrail to get the best fares. Take a look at our budget tips [here](https://flightfree.co.uk/post/how-to-travel-on-a-budget/).
    question: But flying is so cheap!
  - answer: >-
      Many airlines offer carbon offsetting as standard, and claim to therefore
      be ‘carbon neutral’. Unfortunately this is a bit too good to be true. A
      2017 study showed that the majority of carbon offsetting schemes [didn’t
      absorb the necessary
      carbon](https://www.responsibletravel.com/copy/carbon-offsets), and while
      there are some gold-standard schemes out there, most of them rely on
      future carbon absorption (i.e. through planting trees), whereas flying
      emits carbon now.


      In addition, carbon offset schemes often mean that people feel that they have dealt with the impact of their flight, so they continue to fly. The best way to offset carbon emissions is not to produce them in the first place.
    question: What about carbon offsetting?
  - answer: >-
      Flights work on a supply and demand basis. Nowhere has this been more
      keenly felt than during Covid-19 when people stopped flying, so planes
      stayed grounded. 


      In the short term, your decision not to take a flight might not ground that particular plane, but in the longer term, lower demand leads to less supply. In Sweden, where the no-fly movement has been longest established, flight bookings fell by 9% in 2019 and rail bookings were up.
    question: The plane will take off anyway so there’s no point in me not flying
  - answer: >-
      Not flying doesn’t mean not travelling (see our [How to
      pages](/how_to/#destination-inspiration) for flight-free travel
      inspiration) so there is still plenty of opportunity to support
      international tourism without flying. However, we musn’t forget that many
      countries suffer from over-tourism (e.g. Bali and New Zealand) while our
      own tourism industry here in the UK is struggling. Supporting our local
      tourism industry is just as worthwhile.


      In addition, the aviation sector is not the only industry that provides jobs. Expanded rail travel and engineering in renewable technology, for example, could provide equivalent employment opportunities. A [2022 study](https://www.instagram.com/p/CaIAhMgo2Lq/) showed that moving to green transport would create more jobs than would be lost in the aviation sector.
    question: What about global tourism and the jobs involved with aviation?
